name: CI

on:
  push:
  pull_request:
    branches: [main]

jobs:
  # ========================================================
  # Block 1: Code Quality, Lint & Static Analysis
  # ========================================================
  quality:
    name: Code Quality & Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            client/package-lock.json
            server/package-lock.json

      - name: Verify server syntax
        working-directory: server
        run: |
          npm ci
          node --check src/server.js
          node --check src/app.js

      - name: Lint client codebase
        working-directory: client
        run: |
          npm ci
          npm run lint

  # ========================================================
  # Block 2: Automated Test Suites (Server & Client)
  # ========================================================
  server-tests:
    name: Server tests
    needs: quality
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: root
      DB_NAME: bbms
      JWT_SECRET: ci-only-secret

    defaults:
      run:
        working-directory: server

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm run db:setup
      - run: npm run test:unit
      # Integration tests share one database, so run them one file at a time
      - run: npm run test:integration -- --runInBand

  client-tests:
    name: Client tests
    needs: quality
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: client

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm test

  # ========================================================
  # Block 3: Production Build & Artifact Packaging
  # ========================================================
  build-and-package:
    name: Production build & package
    needs: [server-tests, client-tests]
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: client

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Archive production build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: client-production-build
          path: client/dist/
          retention-days: 7
